name: format-floor-calibration-real-cpu

# Completed the initial real-model PR run on 2026-10-10.
# Manual-only thereafter; never rerun CPU inference for documentation edits.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-format-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/ipseity-format-hf-models
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU inference framework
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Pinned model tools and package
        run: |
          python -m pip install "transformers==4.57.3" "huggingface_hub==0.36.0" safetensors
          python -m pip install -e .
      - name: Perform ACTUAL next-token and free-letter calibration
        run: python -m tools.format_floor_calibration --outdir format-results
      - name: Preserve complete and partial REAL calibration outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-real-cpu-${{ github.run_id }}
          path: format-results/
          if-no-files-found: warn
          retention-days: 7
