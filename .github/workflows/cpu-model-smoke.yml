name: small-model-real-inference-smoke

# Only the research runner or its workflow triggers real downloads.
# Standard ubuntu-latest on this PUBLIC repo is non-billable GitHub Actions.
on:
  pull_request:
    paths:
      - ".github/workflows/cpu-model-smoke.yml"
      - "tools/cpu_model_smoke.py"
      - "src/synthetic_ipseity/behavioral_pilot.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-cpu-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-paired-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/ipseity-hf-models
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned inference tools and project
        run: |
          python -m pip install "transformers==4.57.3" "huggingface_hub==0.36.0" safetensors
          python -m pip install -e .
          python -c "import torch,transformers,huggingface_hub; print('torch',torch.__version__,'transformers',transformers.__version__,'huggingface_hub',huggingface_hub.__version__)"
      - name: Run ACTUAL eight-trial paired CPU smoke
        run: python tools/cpu_model_smoke.py --outdir pilot-results
      - name: Preserve raw real-model responses and sealed micro-manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-cpu-smoke-${{ github.run_id }}
          path: pilot-results/
          if-no-files-found: warn
          retention-days: 7
