name: contract-tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tools/diagnose.py
      - run: python tools/organ_diagnostic.py
      - run: python tools/durable_diagnostic.py
      - run: python tools/epistemic_diagnostic.py
      - run: python tools/longitudinal_diagnostic.py
      - run: python tools/belief_revision_diagnostic.py
      - run: python tools/palinode_diagnostic.py
      - run: python -m unittest discover -s tests -p 'test_format_probe.py' -v
      - run: python -m unittest discover -s tests -p 'test_evidence_ablation.py' -v
      - run: python tools/continuity_benchmark.py prepare --out /tmp/ipseity-pilot-manifest.json
      - run: python tools/continuity_benchmark.py simulate --manifest /tmp/ipseity-pilot-manifest.json --out /tmp/ipseity-pilot-fixtures.jsonl
      - run: python tools/continuity_benchmark.py evaluate --manifest /tmp/ipseity-pilot-manifest.json --responses /tmp/ipseity-pilot-fixtures.jsonl --out /tmp/ipseity-pilot-calibration.json
      - run: python -m compileall -q src tests tools
